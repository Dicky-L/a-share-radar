<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A股启动与卖出雷达｜日报档案</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:#0a1220;color:#e9f0fc}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#091321,#132039);min-height:100vh}a{color:#93c4ff}button,input{font:inherit}button{cursor:pointer}
header{padding:28px 22px;max-width:1350px;margin:auto;display:flex;gap:20px;align-items:center;justify-content:space-between}header h1{margin:4px 0;font-size:clamp(22px,3vw,30px)}header p{margin:5px 0;color:#9aacc6;font-size:13px}.eyebrow{font-size:11px;letter-spacing:.14em;color:#88a3c6;font-weight:750}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{color:#d2e1f7;text-decoration:none;background:#1c2d47;border:1px solid #39506e;border-radius:9px;padding:10px;font-size:12px}
main{max-width:1350px;margin:auto;padding:0 22px 50px;display:grid;grid-template-columns:310px minmax(0,1fr);gap:18px}.side,.reader{background:#142037;border:1px solid #2c3d59;border-radius:15px;overflow:hidden}.side{position:sticky;top:18px;align-self:start}.sidehead{padding:18px;border-bottom:1px solid #30405b}.sidehead strong{display:block;margin-bottom:10px}input{background:#0a172b;color:#e5eefc;border:1px solid #3d526e;border-radius:8px;padding:11px;width:100%;outline:none}input:focus{border-color:#75acf0}.filter{display:flex;gap:8px;margin-top:8px}.filter input{flex:1;min-width:0}.filter button,.controls button{background:#223854;color:#d3e4f9;border:1px solid #3e5a7a;border-radius:8px;padding:9px 11px}.subtle{font-size:11px;color:#8396b3}
.list{max-height:72vh;overflow:auto;padding:8px}.item{background:none;border:1px solid transparent;text-align:left;width:100%;color:inherit;padding:12px;border-radius:9px;margin:2px 0}.item:hover{background:#223854}.item.current{border-color:#517db5;background:#213957}.date{font-weight:800}.tag{float:right;font-size:10px;background:#2c4462;color:#b3c7e3;padding:4px 8px;border-radius:9px}.tag.full{background:#1c4a42;color:#9be6d6}.desc{display:block;color:#a4b6d0;font-size:12px;line-height:1.5;margin-top:7px}
.reader{min-height:680px}.readerhead{padding:24px 30px;border-bottom:1px solid #2b3e59}.readerhead h2{font-size:24px;margin:7px 0;line-height:1.4}.meta{font-size:12px;color:#91a6c3}.controls{margin-top:15px;display:flex;gap:7px;flex-wrap:wrap}.controls button{font-size:12px;padding:7px 11px}.controls button:disabled{opacity:.35}.content{padding:18px 31px 32px;font-size:14px;line-height:1.88;overflow-wrap:anywhere}.content h1,.content h2,.content h3{color:#f6faff;line-height:1.35}.content h1{font-size:23px}.content h2{font-size:19px;border-bottom:1px solid #334865;padding-bottom:8px;margin:26px 0 15px}.content h3{font-size:16px;margin-top:22px}.content p{margin:11px 0}.content strong{color:#fff}.content blockquote{border-left:3px solid #7eb5f3;background:#1b304c;padding:8px 16px;margin:12px 0}.content ul,.content ol{padding-left:22px}.content li{margin:5px 0}.content hr{border:0;border-top:1px solid #30415b;margin:22px 0}.tablebox{max-width:100%;overflow:auto;margin:14px 0}.content table{min-width:460px;border-collapse:collapse;font-size:12px;width:100%}.content td,.content th{padding:8px 11px;border:1px solid #3b506e;text-align:left}.content th{background:#263d5b}.content pre{background:#0b182c;overflow:auto;padding:13px;border-radius:8px}.content code{background:#243751;color:#9bd6ff;padding:2px 4px;border-radius:4px}.content pre code{background:transparent}.content a{color:#a6d4ff}.placeholder{text-align:center;color:#a9bdd7;padding:70px 20px}footer{max-width:1350px;margin:auto;padding:0 22px 26px;color:#859bb7;font-size:12px}
@media(max-width:800px){header{display:block;padding:23px 16px}.nav{margin-top:14px}main{display:block;padding:0 13px 28px}.side{position:relative;top:0;margin-bottom:14px}.list{max-height:195px}.readerhead{padding:20px}.readerhead h2{font-size:20px}.content{padding:9px 19px 26px}}
</style>
<header><div><div class="eyebrow">DAILY RADAR REPORTS</div><h1>A股启动与卖出雷达</h1><p>18:00 推送归档中心 · 按日期阅读 · 股票/板块关键词检索 · 历史复盘</p></div><nav class="nav"><a href="./market.html">原行情工作台 ↗</a><a href="https://github.com/Dicky-L/a-share-radar/tree/main/reports">GitHub 报告源 ↗</a></nav></header>
<main><aside class="side"><div class="sidehead"><strong>日报目录 <span id="count" class="subtle"></span></strong><input id="search" type="search" placeholder="搜索股票、板块、日期和报告内容" aria-label="搜索日报"/><div class="filter"><input id="month" type="month" aria-label="按月筛选"/><button id="reset">清除</button></div><p class="subtle">旧报告摘要会标记“摘要”，不冒充原始全文。</p></div><div id="list" class="list"></div></aside>
<article class="reader"><div class="readerhead"><div class="eyebrow">RESEARCH ARCHIVE</div><h2 id="title">加载报告中…</h2><div class="meta" id="meta"></div><div class="controls"><button disabled id="copy">复制正文</button><button disabled id="permalink">复制本篇链接</button><button disabled id="raw">查看原始 Markdown</button></div></div><div class="content" id="content"><div class="placeholder">读取归档中…</div></div></article></main>
<footer>仅供研究，不构成投资建议。公开仓库请勿归档真实持仓成本、账户信息或其他敏感资料。ChatGPT 18:00推送与网站自动入库是两个独立环节。</footer>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let entries=[],active="",current="",filepath="";
function inl(s){return esc(s).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_m,t,url)=>'<a target="_blank" rel="noopener noreferrer" href="'+url+'">'+t+'</a>').replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>").replace(/\x60([^\x60]+)\x60/g,"<code>$1</code>")}
function renderMarkdown(src){
 let a=src.replace(/\r/g,"").replace(/^---\n[\s\S]*?\n---\n/,"").split("\n"),out=[],kind=null,coding=false,code=[];
 const finish=()=>{if(kind){out.push("</"+kind+">");kind=null}};
 for(let i=0;i<a.length;i++){
  let line=a[i].trim();if(line.startsWith(String.fromCharCode(96).repeat(3))){finish();if(coding){out.push("<pre><code>"+esc(code.join("\n"))+"</code></pre>");code=[]}coding=!coding;continue}
  if(coding){code.push(a[i]);continue}if(!line){finish();continue}
  if(/^\|.*\|$/.test(line)&&i+1<a.length&&/^\|[\s:|\-]+\|$/.test(a[i+1].trim())){
   finish();const cells=t=>t.replace(/^\||\|$/g,"").split("|").map(x=>inl(x.trim()));let heads=cells(line);
   out.push("<div class='tablebox'><table><thead><tr>"+heads.map(v=>"<th>"+v+"</th>").join("")+"</tr></thead><tbody>");i+=2;
   while(i<a.length&&/^\|.*\|$/.test(a[i].trim())){let values=cells(a[i]);out.push("<tr>"+heads.map((_,j)=>"<td>"+(values[j]||"")+"</td>").join("")+"</tr>");i++}i--;
   out.push("</tbody></table></div>");continue
  }
  let h=line.match(/^(#{1,6})\s+(.+)$/);if(h){finish();let n=Math.min(h[1].length,4);out.push("<h"+n+">"+inl(h[2])+"</h"+n+">");continue}
  if(/^[-*]{3,}$/.test(line)){finish();out.push("<hr>");continue}
  if(line.startsWith(">")){finish();out.push("<blockquote>"+inl(line.slice(1).trim())+"</blockquote>");continue}
  let u=line.match(/^[-*+]\s+(.+)/),o=line.match(/^\d+[.)]\s+(.+)/);
  if(u||o){let t=o?"ol":"ul";if(kind!==t){finish();kind=t;out.push("<"+t+">")}out.push("<li>"+inl((u||o)[1])+"</li>");continue}
  finish();out.push("<p>"+inl(line)+"</p>")
 }
 finish();return out.join("\n")
}
function filtered(){let q=$("search").value.trim().toLowerCase(),m=$("month").value;return entries.filter(x=>(!m||x.date.startsWith(m))&&(!q||[x.date,x.title,x.preview,x.search_text].join(" ").toLowerCase().includes(q)))}
function list(){let matches=filtered();$("count").textContent=matches.length+"篇";$("list").innerHTML=matches.length?matches.map(e=>"<button type='button' data-date='"+esc(e.date)+"' class='item "+(active===e.date?"current":"")+"'><span class='date'>"+esc(e.date)+"</span><span class='tag "+(e.status==="original"?"full":"")+"'>"+(e.status==="original"?"全文":"摘要")+"</span><span class='desc'>"+esc(e.preview)+"</span></button>").join(""):"<div class='placeholder'>没有匹配的报告</div>"}
async function openReport(date){let item=entries.find(e=>e.date===date);if(!item)return;active=date;list();$("title").textContent=item.title;$("meta").textContent="发布日期 "+item.date+" · "+(item.status==="original"?"全文归档":"历史摘要回填")+" · "+(item.source||"仓库");$("content").innerHTML="<div class='placeholder'>正在读取日报…</div>";filepath=item.file;
try{let r=await fetch(item.file+"?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);current=await r.text();$("content").innerHTML=renderMarkdown(current);["copy","permalink","raw"].forEach(id=>$(id).disabled=false);let url=new URL(location.href);url.searchParams.set("date",date);history.replaceState(null,"",url)}catch(e){$("content").textContent="无法读取报告："+e.message}}
$("list").onclick=e=>{let el=e.target.closest("[data-date]");if(el)openReport(el.dataset.date)};
$("search").oninput=list;$("month").onchange=list;$("reset").onclick=()=>{$("search").value="";$("month").value="";list()};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(current);$("copy").textContent="已复制"}catch(e){$("copy").textContent="复制失败"}};
$("permalink").onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$("permalink").textContent="已复制"}catch(e){$("permalink").textContent="复制失败"}};
$("raw").onclick=()=>{if(filepath)window.open(filepath,"_blank","noopener,noreferrer")};
(async()=>{try{let r=await fetch("./reports/index.json?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);let d=await r.json();entries=(d.items||[]).sort((a,b)=>b.date.localeCompare(a.date));list();let wanted=new URLSearchParams(location.search).get("date");if(entries.length)await openReport((entries.find(e=>e.date===wanted)||entries[0]).date);else{$("title").textContent="暂未归档日报";$("content").textContent="请把每日完整Markdown报告加入 reports/YYYY-MM-DD.md"}}catch(e){$("title").textContent="无法加载日报索引";$("content").textContent="请检查 reports/index.json："+e.message}})();
</script></html>
