<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A股启动与卖出雷达</title><style>:root{color-scheme:dark}body{font:14px system-ui;background:#0b1220;color:#e5edfc;margin:0}.wrap{max-width:1200px;margin:auto;padding:30px}h1{font-size:27px}p,small{color:#9aa8bf}.nav{display:flex;gap:8px;flex-wrap:wrap}button,input{background:#17243a;color:#ecf2ff;border:1px solid #30435e;border-radius:8px;padding:10px;cursor:pointer}input{cursor:text}button:hover{background:#243957}button.active{background:#225a92}.panel{background:#121d30;border:1px solid #263751;border-radius:12px;margin:16px 0;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.value{font-size:24px;font-weight:bold;color:white}.muted{color:#9aa8bf}.err{color:#ffb17d}.up{color:#ff7272}.down{color:#54cd99}table{width:100%;border-collapse:collapse;min-width:700px}td,th{border-bottom:1px solid #263751;padding:9px;text-align:left}section{display:none}section.active{display:block}.scroll{overflow:auto}.bars{display:flex;gap:10px;align-items:center}.track{height:8px;background:#263751;min-width:70px;flex:1;border-radius:6px}.fill{height:100%;background:#9ca3af;border-radius:6px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{padding:12px;border-bottom:1px solid #263751}@media(max-width:600px){.wrap{padding:14px}.split{gap:6px}h1{font-size:21px}}</style><div class="wrap"><h1>↗ A股启动与卖出雷达</h1><p>盘后真实行情快照工作台 · 没有采集结果不显示假行情 · 不是盘中实时行情</p><div class="nav" id="nav"></div><div class="panel"><span id="status">读取行情中…</span>　<button id="refresh">刷新已发布数据</button><small>　刷新只重新读取数据文件</small></div><section id="overview" class="active"><h2>市场总览</h2><div class="grid" id="metrics"></div><div class="panel"><h3>双日行业资金 Top 10</h3><div id="summary"></div></div></section><section id="sectors"><h2>行业双日资金对照</h2><p>两日同板块同尺度，灰色成交规模；主力净额红流入、绿流出。未获取的买入/卖出总额保留待核。</p><div class="panel" id="sectorgraph"></div><div class="panel scroll" id="sectortable"></div></section><section id="stocks"><h2>股票搜索</h2><input id="search" placeholder="输入代码或名称" /><div class="panel scroll" id="stocktable"></div></section><section id="watch"><h2>观察池</h2><p>本地浏览器保存；并非自动推荐或实际买入。</p><input id="watchcode" placeholder="输入6位代码"><button id="addwatch">加入观察</button><div class="panel" id="watchrows"></div></section><section id="history"><h2>历史快照</h2><div class="panel" id="historyrows"></div></section><section id="holdings"><h2>真实持仓</h2><p>仅输入确认成交的持仓；浮盈亏不含交易费用、分红和税费。</p><input id="hcode" placeholder="股票代码"><input id="hcost" type="number" step="0.001" placeholder="成本价"><input id="hqty" type="number" placeholder="股数"><input id="hdate" type="date"><button id="addholding">保存持仓</button><div class="panel scroll" id="holdingrows"></div></section><small>研究工具不构成投资建议。A股T+1、跳空、跌停存在实际成交风险。</small></div><script>
const tabs={overview:'市场总览',sectors:'行业资金',stocks:'股票搜索',watch:'观察池',history:'历史快照',holdings:'我的持仓'},E=id=>document.getElementById(id),fmt=(x,d=2)=>x==null||!Number.isFinite(+x)?'待核':Number(x).toLocaleString('zh-CN',{maximumFractionDigits:d}),signed=x=>x==null?'待核':(x>0?'+':'')+fmt(x),safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let idx={dates:[]},now=null,prev=null;let watch=JSON.parse(localStorage.getItem('radar-watch')||'[]'),hold=JSON.parse(localStorage.getItem('radar-hold')||'[]');const save=()=>{localStorage.setItem('radar-watch',JSON.stringify(watch));localStorage.setItem('radar-hold',JSON.stringify(hold))},empty='尚无已核实的真实行情数据。请先运行采集任务。';function page(k){document.querySelectorAll('section').forEach(x=>x.classList.toggle('active',x.id===k));document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.id===k))}E('nav').innerHTML=Object.entries(tabs).map(([k,v])=>'<button data-id="'+k+'">'+v+'</button>').join('');E('nav').onclick=e=>{let k=e.target.dataset.id;if(k)page(k)};page('overview');async function json(path){let r=await fetch(path+'?t='+Date.now());if(!r.ok)throw Error(path+' '+r.status);return r.json()}async function refresh(){E('status').textContent='加载已归档数据…';try{idx=await json('./data/index.json');const dates=idx.dates||[];now=dates.length?await json('./data/snapshots/'+dates.at(-1)+'.json'):null;prev=dates.length>1?await json('./data/snapshots/'+dates.at(-2)+'.json'):null;if(now&&(!now.date||!now.market||!Array.isArray(now.stocks)))throw Error('行情校验失败');E('status').textContent=now?'数据日期 '+now.date+' · 盘后快照':'无真实行情快照（页面交互可用）'}catch(e){now=null;prev=null;E('status').textContent='数据读取失败：'+e.message}render()}E('refresh').onclick=refresh;function secPairs(){let a=new Map((prev?.sectors||[]).map(x=>[x.name,x]));return(now?.sectors||[]).filter(x=>a.has(x.name)).map(x=>({before:a.get(x.name),after:x,name:x.name})).sort((a,b)=>Math.abs((b.after.net_yi??0)-(b.before.net_yi??0))-Math.abs((a.after.net_yi??0)-(a.before.net_yi??0))).slice(0,10)}function render(){let m=now?.market,p=prev?.market;E('metrics').innerHTML=[['沪深A股股票成交额',m?.turnover_yi,'亿元'],['前一交易日成交额',p?.turnover_yi,'亿元'],['成交额变化',m&&p?(m.turnover_yi-p.turnover_yi)/p.turnover_yi*100:null,'%'],['行业板块',now?.sectors?.length,'个']].map(([k,v,u])=>'<div class="panel"><small>'+k+'</small><div class="value">'+(v==null?'待核':fmt(v)+u)+'</div></div>').join('');let pairs=secPairs(),max=Math.max(1,...pairs.flatMap(x=>[x.before.turnover_yi||0,x.after.turnover_yi||0]));E('summary').textContent=pairs.length?'已核实同名行业 '+pairs.length+' 个，可进入「行业资金」查看':'双日行业数据不齐，暂无可画的资金图';E('sectorgraph').innerHTML=pairs.length?pairs.map(x=>'<div class="row"><b>'+safe(x.name)+'</b><div class="split">'+[x.before,x.after].map((s,i)=>'<div><small>'+(i?now.date:prev.date)+'</small><div class="bars"><div class="track"><div class="fill" style="width:'+(100*(s.turnover_yi||0)/max)+'%"></div></div><b>'+fmt(s.turnover_yi)+'亿</b></div><div class="'+(s.net_yi>0?'up':s.net_yi<0?'down':'muted')+'">主力净额 '+signed(s.net_yi)+'亿 · '+signed(s.net_strength_pct)+'%</div><small>市场占比 '+fmt(s.market_share_pct)+'%</small></div>').join('')+'</div></div>').join(''):empty;E('sectortable').innerHTML=pairs.length?'<table><tr><th>行业</th><th>前日成交(亿)</th><th>今日成交(亿)</th><th>成交变化%</th><th>前日净流(亿)</th><th>今日净流(亿)</th><th>净额变化(亿)</th><th>买入额</th><th>卖出额</th></tr>'+pairs.map(x=>'<tr><td>'+safe(x.name)+'</td><td>'+fmt(x.before.turnover_yi)+'</td><td>'+fmt(x.after.turnover_yi)+'</td><td>'+fmt(x.before.turnover_yi?((x.after.turnover_yi-x.before.turnover_yi)/x.before.turnover_yi*100):null)+'</td><td>'+signed(x.before.net_yi)+'</td><td>'+signed(x.after.net_yi)+'</td><td>'+signed(x.before.net_yi==null||x.after.net_yi==null?null:x.after.net_yi-x.before.net_yi)+'</td><td>'+fmt(x.after.buy_yi)+'</td><td>'+fmt(x.after.sell_yi)+'</td></tr>').join('')+'</table>':empty;renderStock();renderWatch();renderHold();E('historyrows').innerHTML=(idx.dates||[]).length?idx.dates.map(d=>'<div class="row"><a style="color:#89bdff" href="./data/snapshots/'+encodeURIComponent(d)+'.json">'+safe(d)+' 原始JSON ↗</a></div>').join(''):empty}function filtered(){let q=E('search').value.trim();return(now?.stocks||[]).filter(x=>(x.code+x.name).includes(q)).slice(0,100)}function renderStock(){let rows=filtered();E('stocktable').innerHTML=rows.length?'<table><tr><th>代码</th><th>名称</th><th>收盘价</th><th>涨跌幅</th><th>成交额(亿)</th></tr>'+rows.map(x=>'<tr><td>'+safe(x.code)+'</td><td>'+safe(x.name)+'</td><td>'+fmt(x.price)+'</td><td>'+fmt(x.change_pct)+'%</td><td>'+fmt(x.turnover_yi)+'</td></tr>').join('')+'</table>':empty}E('search').oninput=renderStock;function renderWatch(){E('watchrows').innerHTML=watch.length?watch.map((c,i)=>'<div class="row">'+safe(c)+' <button data-del="'+i+'">移除</button></div>').join(''):empty}E('addwatch').onclick=()=>{let c=E('watchcode').value.trim();if(!/^((60|00|30)\d{4})$/.test(c)){alert('仅允许沪深主板及创业板6位代码');return}if(!watch.includes(c))watch.push(c);save();renderWatch();E('watchcode').value=''};E('watchrows').onclick=e=>{if(e.target.dataset.del!=null){watch.splice(+e.target.dataset.del,1);save();renderWatch()}};function renderHold(){E('holdingrows').innerHTML=hold.length?'<table><tr><th>股票</th><th>数量</th><th>成本</th><th>买入日</th><th>最近收盘</th><th>参考盈亏(元)</th><th>操作</th></tr>'+hold.map((h,i)=>{let s=(now?.stocks||[]).find(x=>x.code===h.code);return '<tr><td>'+safe(h.code)+'</td><td>'+h.qty+'</td><td>'+fmt(h.cost)+'</td><td>'+safe(h.date)+'</td><td>'+fmt(s?.price)+'</td><td>'+signed(s?.price==null?null:(s.price-h.cost)*h.qty)+'</td><td><button data-del="'+i+'">删除</button></td></tr>'}).join('')+'</table>':empty}E('addholding').onclick=()=>{let code=E('hcode').value.trim(),cost=+E('hcost').value,qty=+E('hqty').value,date=E('hdate').value;if(!/^((60|00|30)\d{4})$/.test(code)||cost<=0||qty<=0||!date){alert('填写有效的代码、成本、股数、日期');return}hold.push({code,cost,qty,date});save();renderHold()};E('holdingrows').onclick=e=>{if(e.target.dataset.del!=null){hold.splice(+e.target.dataset.del,1);save();renderHold()}};refresh();
</script></html>
