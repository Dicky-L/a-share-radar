name: Deploy radar to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - market.html
      - performance.html
      - monthly.html
      - reports/**
      - tests/**
      - scripts/build_report_index.py
      - scripts/build_candidate_index.py
      - scripts/build_performance.py
      - scripts/build_chart_data.py
      - data/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify report reader JavaScript syntax
        run: node --check assets/reading.js && node --check assets/charts.js && node --check assets/pickboard.js && node --check assets/daily.js
      - name: Test stock-selection archive
        run: python3 -m unittest discover -s tests -p 'test_candidate_index.py' -v
      - name: Build searchable archive index
        run: python3 scripts/build_report_index.py
      - name: Test market chart data validation
        run: python3 -m unittest discover -s tests -p 'test_chart_data.py' -v
      - name: Build archived stock-selection index
        run: python3 scripts/build_candidate_index.py
      - name: Validate recommendation performance calculations
        run: python3 -m unittest discover -s tests -p 'test_performance.py' -v
      - name: Build verified market visual summaries
        run: python3 scripts/build_chart_data.py
      - name: Build selection outcome dashboard from verified closing snapshots
        run: python3 scripts/build_performance.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
