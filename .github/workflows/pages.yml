name: Deploy radar to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - market.html
      - performance.html
      - replay.html
      - scripts/replay_asof.py
      - monthly.html
      - reports/**
      - tests/**
      - templates/**
      - scripts/build_report_index.py
      - scripts/check_daily_publication.py
      - scripts/check_sector_consistency.py
      - scripts/build_candidate_index.py
      - scripts/build_performance.py
      - scripts/build_chart_data.py
      - data/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify report reader JavaScript syntax
        run: node --check assets/reading.js && node --check assets/charts.js && node --check assets/pickboard.js && node --check assets/daily.js && node --check assets/pool-guide.js && node --check assets/rolling.js && node --check assets/report-template.js
      - name: Verify Oct 28 screenshot-style ten-industry chart from real report data
        run: node tests/test_sector_chart.cjs
      - name: Validate primary industry funds against per-date canonical store
        run: python3 scripts/check_sector_consistency.py && python3 -m unittest discover -s tests -p 'test_sector_consistency.py' -v
      - name: Test unified stock report template and verified 10-sector comparisons
        run: python3 -m unittest discover -s tests -p 'test_report_template.py' -v
      - name: Test stock-selection archive
        run: python3 -m unittest discover -s tests -p 'test_candidate_index.py' -v
      - name: Test strict point-in-time replay / anti-lookahead invariants
        run: python3 -m unittest discover -s tests -p 'test_replay_asof.py' -v
      - name: Build historical time-slice selections and independent future observations
        run: python3 scripts/replay_asof.py --end 2026-10-22
      - name: Test daily primary report publication contract
        run: python3 -m unittest discover -s tests -p 'test_daily_publication.py' -v
      - name: Build searchable archive index
        run: python3 scripts/build_report_index.py
      - name: Test market chart data validation
        run: python3 -m unittest discover -s tests -p 'test_chart_data.py' -v
      - name: Build archived stock-selection index
        run: python3 scripts/build_candidate_index.py
      - name: Validate recommendation performance calculations
        run: python3 -m unittest discover -s tests -p 'test_performance.py' -v
      - name: Build verified market visual summaries
        run: python3 scripts/build_chart_data.py
      - name: Build selection outcome dashboard from verified closing snapshots
        run: python3 scripts/build_performance.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
