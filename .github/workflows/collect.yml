name: Collect verified AKShare post-close data
on:
  push:
    branches: [main]
    paths:
      - collect.py
      - requirements.txt
      - tests/**
      - .github/workflows/collect.yml
  schedule:
    - cron: '15 10 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: verified-market-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Test source, parsing, freshness and safe publication
        run: python -m unittest discover -s tests -v
      - name: Fetch verified post-close quotes (no fabricated data)
        run: python collect.py
        env:
          PYTHONUNBUFFERED: '1'
      - name: Commit only valid dated snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "data: publish verified AKShare+Tencent snapshot"
            git push
          fi
