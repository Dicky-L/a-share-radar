name: Collect verified AKShare post-close data
on:
  push:
    branches: [main]
    paths:
      - collect.py
      - requirements.txt
      - tests/**
      - .github/workflows/collect.yml
  schedule:
    # Beijing 18:15 Monday-Friday (GitHub cron uses UTC).
    - cron: '15 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      updated: ${{ steps.commit.outputs.updated }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Test quote parsing, trading dates and fail-closed snapshots
        run: python -m unittest discover -s tests -v
      - name: Fetch verified post-close quotes
        run: python collect.py
        env:
          PYTHONUNBUFFERED: '1'
      - name: Commit verified snapshots
        id: commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --staged --quiet; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "No new verified snapshot to publish."
            exit 0
          fi
          git commit -m "data: publish verified post-close snapshot"
          # Other commits may land while the 5k-stock collector is running.
          # Rebase rather than force pushing or discarding those commits.
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "updated=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Remote main changed; rebasing snapshot commit (attempt $attempt)."
            git pull --rebase origin main
            sleep "$attempt"
          done
          echo "Failed to safely push the snapshot after four attempts." >&2
          exit 1

  deploy:
    name: Publish collected data to GitHub Pages
    needs: collect
    if: needs.collect.outputs.updated == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout latest main with new snapshots
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Build daily report archive before publishing
        run: python3 scripts/build_report_index.py
      - name: Build archived stock-selection index
        run: python3 scripts/build_candidate_index.py
      - name: Build verified market visual summaries
        run: python3 scripts/build_chart_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy latest snapshots
        id: deploy
        uses: actions/deploy-pages@v4
